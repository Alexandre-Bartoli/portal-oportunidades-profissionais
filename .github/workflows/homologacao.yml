# Execução isolada de homologação
name: Homologacao isolada das vagas
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/homologacao.yml'
permissions:
  contents: read
jobs:
  homologacao:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Testar codigo Python
        run: python3 -m unittest discover -s tests -q
      - name: Coletar e gravar anuncios em banco isolado, sem publicar dados
        run: python3 app.py stage-collect --min-sources 2
        env:
          PORTAL_HTTP_TIMEOUT: '8'
          PORTAL_HTTP_ATTEMPTS: '2'
      - name: Diagnosticar persistencia temporaria e pendencias de fontes
        if: always()
        run: |
          python3 app.py stage-review-sources
          python3 app.py stage-backups
          if [ -f data/homologacao.sqlite3 ]; then
            python3 app.py stage-check-links --limit 12
          fi
      - name: Relatar apenas estado e contagens
        if: always()
        run: |
          if [ -f data/homologacao_status.json ]; then
            python3 app.py stage-status
          fi
      - name: Guardar apenas o relatorio, nunca o banco SQLite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homologacao-diagnostico
          path: data/homologacao_status.json
          if-no-files-found: warn
          retention-days: 7