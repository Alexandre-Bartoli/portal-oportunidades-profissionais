name: Obter dados oficiais de localidades
on:
  push:
    paths:
      - '.github/workflows/ibge-localidades.yml'
permissions:
  contents: read
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar a base oficial do IBGE
        run: curl --fail --location --retry 2 --max-time 100 --output localidades.zip https://geoftp.ibge.gov.br/organizacao_do_territorio/estrutura_territorial/localidades/Localidades_do_Brasil/2022/Localidades_Brasil_gpkg.zip
      - name: Registrar tamanho e integridade
        run: |
          sha256sum localidades.zip
          unzip -t localidades.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ibge-localidades-2022
          path: localidades.zip
          retention-days: 1
